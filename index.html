<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="لوحة درجات بسيطة بالعربية والإنجليزية — A simple bilingual grade dashboard.">
  <title>لوحة الدرجات | Grade Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #101827;
      color: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #9eabc0;
      --line: rgba(255, 255, 255, .1);
      --panel: rgba(24, 35, 53, .88);
      --mint: #78e2bd;
      --blue: #8eafff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 48px;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(90, 116, 214, .2), transparent 34rem),
        radial-gradient(ellipse at 88% 82%, rgba(64, 190, 155, .12), transparent 32rem),
        #101827;
    }

    button { font: inherit; }

    .page { width: min(100%, 760px); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 11px; color: #e8edf7; font-weight: 700; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(120, 226, 189, .28);
      border-radius: 13px;
      background: rgba(120, 226, 189, .1);
      color: var(--mint);
      font-size: 19px;
    }

    .language-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .04);
    }

    .language-switch button {
      min-width: 48px;
      padding: 7px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] { background: #29364a; color: #fff; }
    button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px);
    }

    .hero { position: relative; padding: clamp(24px, 6vw, 46px); }
    .hero::after {
      position: absolute;
      top: -90px;
      left: -70px;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(142, 175, 255, .12);
      border-radius: 50%;
      box-shadow: 0 0 0 28px rgba(142, 175, 255, .025), 0 0 0 58px rgba(142, 175, 255, .02);
      content: "";
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      color: var(--mint);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .eyebrow::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -.04em; line-height: 1.15; }
    .subtitle { max-width: 480px; margin: 14px 0 0; color: var(--muted); line-height: 1.8; }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 30px;
      padding: 20px 22px;
      border: 1px solid rgba(120, 226, 189, .17);
      border-radius: 18px;
      background: linear-gradient(110deg, rgba(120, 226, 189, .1), rgba(142, 175, 255, .07));
    }

    .summary-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .9rem; }
    .summary-score { font-size: clamp(1.7rem, 5vw, 2.25rem); font-weight: 750; letter-spacing: -.04em; }
    .summary-score small { color: var(--muted); font-size: .95rem; font-weight: 500; letter-spacing: 0; }
    .summary-icon { display: grid; width: 48px; height: 48px; flex: 0 0 auto; place-items: center; border-radius: 16px; background: rgba(120, 226, 189, .12); color: var(--mint); font-size: 23px; }

    .grades-section { padding: 0 clamp(24px, 6vw, 46px) clamp(26px, 6vw, 44px); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    h2 { margin: 0; font-size: 1.05rem; }
    .count { color: var(--muted); font-size: .82rem; }
    .grades { display: grid; gap: 10px; }

    .grade {
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 16px;
      background: rgba(255, 255, 255, .035);
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }

    .grade:hover { transform: translateY(-2px); border-color: rgba(142, 175, 255, .25); background: rgba(255, 255, 255, .055); }
    .grade-top { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .grade-name { font-weight: 650; }
    .grade-score { color: #dce5f6; font-variant-numeric: tabular-nums; font-weight: 700; }
    .grade-score span { color: var(--muted); font-size: .82rem; font-weight: 500; }
    .track { height: 7px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .08); }
    .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--blue)); }

    footer { padding: 18px 8px 0; color: #7f8ca2; text-align: center; font-size: .8rem; }

    @media (max-width: 480px) {
      body { padding: 18px 12px 32px; }
      .topbar { margin-bottom: 16px; }
      .brand { font-size: .9rem; }
      .brand-mark { width: 34px; height: 34px; }
      .hero { padding-bottom: 26px; }
      .summary { margin-top: 24px; padding: 16px; }
      .grades-section { padding-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span id="brand-name">مساحتي التعليمية</span></div>
      <nav class="language-switch" aria-label="Language / اللغة">
        <button type="button" data-language="ar" aria-pressed="true">العربية</button>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </nav>
    </header>

    <main class="card">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow" id="eyebrow">ملخص الأداء</p>
        <h1 id="page-title">نتائجي الدراسية</h1>
        <p class="subtitle" id="subtitle">كل إنجاز يبدأ بخطوة. إليك نظرة سريعة على درجاتك وتقدمك.</p>
        <div class="summary" aria-live="polite">
          <div>
            <span class="summary-label" id="average-label">المتوسط العام</span>
            <div class="summary-score"><span id="average-score">92</span> <small id="out-of">من 100</small></div>
          </div>
          <span class="summary-icon" aria-hidden="true">↗</span>
        </div>
      </section>

      <section class="grades-section" aria-labelledby="grades-title">
        <div class="section-heading">
          <h2 id="grades-title">المواد الدراسية</h2>
          <span class="count" id="grades-count">4 مواد</span>
        </div>
        <div class="grades" id="grades" aria-live="polite">
          <article class="grade"><div class="grade-top"><span class="grade-name">اللغة العربية</span><span class="grade-score">92 <span>/ 100</span></span></div><div class="track" aria-hidden="true"><div class="fill" style="width:92%"></div></div></article>
          <article class="grade"><div class="grade-top"><span class="grade-name">الرياضيات</span><span class="grade-score">88 <span>/ 100</span></span></div><div class="track" aria-hidden="true"><div class="fill" style="width:88%"></div></div></article>
          <article class="grade"><div class="grade-top"><span class="grade-name">العلوم</span><span class="grade-score">96 <span>/ 100</span></span></div><div class="track" aria-hidden="true"><div class="fill" style="width:96%"></div></div></article>
          <article class="grade"><div class="grade-top"><span class="grade-name">البرمجة</span><span class="grade-score">90 <span>/ 100</span></span></div><div class="track" aria-hidden="true"><div class="fill" style="width:90%"></div></div></article>
        </div>
      </section>
    </main>
    <footer id="footer-text">درجات تجريبية — يمكنك تعديلها في ملف try.js</footer>
  </div>
  <script src="try.js"></script>
</body>
</html>
